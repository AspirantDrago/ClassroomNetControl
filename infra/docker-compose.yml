# Startup probes run frequently until the first success; normal probes stay sparse.
# Requires Docker Engine >= 25 and Docker Compose >= 2.20.2 for start_interval.
services:
  cmnc-postgres:
    image: postgres:18.6-alpine3.24
    container_name: cmnc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CMNC_POSTGRES_USER:-cmnc}
      POSTGRES_PASSWORD: ${CMNC_POSTGRES_PASSWORD:-cmnc_password}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${CMNC_POSTGRES_PORT:-5432}:5432"
    volumes:
      - cmnc_postgres_data:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - cmnc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
      start_interval: 2s

  cmnc-rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    container_name: cmnc-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${CMNC_RABBITMQ_USER:-cmnc}
      RABBITMQ_DEFAULT_PASS: ${CMNC_RABBITMQ_PASSWORD:-cmnc_password}
      RABBITMQ_DEFAULT_VHOST: ${CMNC_RABBITMQ_VHOST:-cmnc}
    ports:
      - "127.0.0.1:${CMNC_RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${CMNC_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - cmnc_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - cmnc-network
    healthcheck:
      # TCP readiness avoids starting two Erlang VMs for every health probe.
      test: ["CMD", "nc", "-z", "-w", "2", "127.0.0.1", "5672"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
      start_interval: 5s

  cmnc-auth-service:
    build:
      context: ..
      dockerfile: services/cmnc-auth-service/Dockerfile
    container_name: cmnc-auth-service
    restart: unless-stopped
    environment:
      CMNC_AUTH_HOST: 0.0.0.0
      CMNC_AUTH_PORT: 8001
      CMNC_AUTH_DATABASE_URL: postgresql+asyncpg://${CMNC_POSTGRES_USER:-cmnc}:${CMNC_POSTGRES_PASSWORD:-cmnc_password}@cmnc-postgres:5432/${CMNC_AUTH_DB:-cmnc_auth}
      CMNC_AUTH_JWT_SECRET: ${CMNC_AUTH_JWT_SECRET}
      CMNC_AUTH_BOOTSTRAP_SUPERADMIN_USERNAME: ${CMNC_AUTH_BOOTSTRAP_SUPERADMIN_USERNAME:-superadmin}
      CMNC_AUTH_BOOTSTRAP_SUPERADMIN_PASSWORD: ${CMNC_AUTH_BOOTSTRAP_SUPERADMIN_PASSWORD}
      CMNC_AUTH_BOOTSTRAP_SUPERADMIN_DISPLAY_NAME: ${CMNC_AUTH_BOOTSTRAP_SUPERADMIN_DISPLAY_NAME:-Super Administrator}
    expose:
      - "8001"
    depends_on:
      cmnc-postgres:
        condition: service_healthy
    networks:
      - cmnc-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s

  # Migrations require PostgreSQL; lifespan connects to RabbitMQ and declares queues.
  cmnc-classroom-service:
    build:
      context: ..
      dockerfile: services/cmnc-classroom-service/Dockerfile
    container_name: cmnc-classroom-service
    restart: unless-stopped
    environment:
      CMNC_CLASSROOM_HOST: 0.0.0.0
      CMNC_CLASSROOM_PORT: 8002
      CMNC_CLASSROOM_DATABASE_URL: postgresql+asyncpg://${CMNC_POSTGRES_USER:-cmnc}:${CMNC_POSTGRES_PASSWORD:-cmnc_password}@cmnc-postgres:5432/${CMNC_CLASSROOM_DB:-cmnc_classroom}
      CMNC_CLASSROOM_RABBITMQ_URL: amqp://${CMNC_RABBITMQ_USER:-cmnc}:${CMNC_RABBITMQ_PASSWORD:-cmnc_password}@cmnc-rabbitmq:5672/${CMNC_RABBITMQ_VHOST:-cmnc}
      CMNC_AMQP_PUBLISH_TIMEOUT_SECONDS: ${CMNC_AMQP_PUBLISH_TIMEOUT_SECONDS:-10}
      CMNC_AMQP_CONSUMER_ATTEMPTS: ${CMNC_AMQP_CONSUMER_ATTEMPTS:-3}
      CMNC_AMQP_RETRY_DELAY_SECONDS: ${CMNC_AMQP_RETRY_DELAY_SECONDS:-0.25}
      CMNC_CLASSROOM_POLICY_SYNC_COMPLETED_QUEUE: cmnc.classroom.policy_sync_completed
      CMNC_CLASSROOM_POLICY_SYNC_FAILED_QUEUE: cmnc.classroom.policy_sync_failed
      CMNC_CLASSROOM_SEED_DEMO_DATA: "false"
      CMNC_CLASSROOM_MANAGED_ADDRESS_LIST_NAME: ${CMNC_POLICY_SYNC_ADDRESS_LIST_NAME:-cmnc_wan_blocked}
    expose:
      - "8002"
    depends_on:
      cmnc-postgres:
        condition: service_healthy
      cmnc-rabbitmq:
        condition: service_healthy
    networks:
      - cmnc-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s

  # Background worker: never a startup prerequisite for the gateway or web.
  cmnc-policy-sync-service:
    build:
      context: ..
      dockerfile: services/cmnc-policy-sync-service/Dockerfile
    container_name: cmnc-policy-sync-service
    restart: unless-stopped
    environment:
      CMNC_POLICY_SYNC_HOST: 0.0.0.0
      CMNC_POLICY_SYNC_PORT: 8007
      CMNC_POLICY_SYNC_RABBITMQ_URL: amqp://${CMNC_RABBITMQ_USER:-cmnc}:${CMNC_RABBITMQ_PASSWORD:-cmnc_password}@cmnc-rabbitmq:5672/${CMNC_RABBITMQ_VHOST:-cmnc}
      CMNC_AMQP_PUBLISH_TIMEOUT_SECONDS: ${CMNC_AMQP_PUBLISH_TIMEOUT_SECONDS:-10}
      CMNC_AMQP_CONSUMER_ATTEMPTS: ${CMNC_AMQP_CONSUMER_ATTEMPTS:-3}
      CMNC_AMQP_RETRY_DELAY_SECONDS: ${CMNC_AMQP_RETRY_DELAY_SECONDS:-0.25}
      CMNC_POLICY_SYNC_CLASSROOM_SERVICE_URL: http://cmnc-classroom-service:8002
      CMNC_POLICY_SYNC_INVENTORY_SERVICE_URL: http://cmnc-inventory-service:8003
      CMNC_POLICY_SYNC_WAN_POLICY_CHANGED_QUEUE: cmnc.policy_sync.wan_policy_changed
      CMNC_POLICY_SYNC_KILL_CONNECTIONS_ON_BLOCK: "true"
      CMNC_POLICY_SYNC_ADDRESS_LIST_NAME: ${CMNC_POLICY_SYNC_ADDRESS_LIST_NAME:-cmnc_wan_blocked}
      CMNC_POLICY_SYNC_MIKROTIK_TIMEOUT_SECONDS: ${CMNC_POLICY_SYNC_MIKROTIK_TIMEOUT_SECONDS:-10}
      CMNC_POLICY_SYNC_RECONCILE_INTERVAL_SECONDS: ${CMNC_POLICY_SYNC_RECONCILE_INTERVAL_SECONDS:-30}
      CMNC_POLICY_SYNC_CONNECTION_QUERY_BATCH_SIZE: ${CMNC_POLICY_SYNC_CONNECTION_QUERY_BATCH_SIZE:-32}
      CMNC_POLICY_SYNC_CONNECTION_DELETE_CONCURRENCY: ${CMNC_POLICY_SYNC_CONNECTION_DELETE_CONCURRENCY:-2}
      CMNC_POLICY_SYNC_TRIGGER_DEBOUNCE_SECONDS: ${CMNC_POLICY_SYNC_TRIGGER_DEBOUNCE_SECONDS:-0.1}
      CMNC_POLICY_SYNC_RETRY_MAX_SECONDS: ${CMNC_POLICY_SYNC_RETRY_MAX_SECONDS:-120}
      CMNC_POLICY_SYNC_RETRY_BASE_SECONDS: ${CMNC_POLICY_SYNC_RETRY_BASE_SECONDS:-5}
    depends_on:
      cmnc-rabbitmq:
        condition: service_healthy
      cmnc-classroom-service:
        condition: service_healthy
      cmnc-inventory-service:
        condition: service_healthy
    expose:
      - "8007"
    networks:
      - cmnc-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8007/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s

  cmnc-inventory-service:
    build:
      context: ..
      dockerfile: services/cmnc-inventory-service/Dockerfile
    container_name: cmnc-inventory-service
    restart: unless-stopped
    environment:
      CMNC_INVENTORY_HOST: 0.0.0.0
      CMNC_INVENTORY_PORT: 8003
      CMNC_INVENTORY_DATABASE_URL: postgresql+asyncpg://${CMNC_POSTGRES_USER:-cmnc}:${CMNC_POSTGRES_PASSWORD:-cmnc_password}@cmnc-postgres:5432/${CMNC_INVENTORY_DB:-cmnc_inventory}
      CMNC_INVENTORY_RABBITMQ_URL: amqp://${CMNC_RABBITMQ_USER:-cmnc}:${CMNC_RABBITMQ_PASSWORD:-cmnc_password}@cmnc-rabbitmq:5672/${CMNC_RABBITMQ_VHOST:-cmnc}
      CMNC_AMQP_PUBLISH_TIMEOUT_SECONDS: ${CMNC_AMQP_PUBLISH_TIMEOUT_SECONDS:-10}
      CMNC_AMQP_CONSUMER_ATTEMPTS: ${CMNC_AMQP_CONSUMER_ATTEMPTS:-3}
      CMNC_AMQP_RETRY_DELAY_SECONDS: ${CMNC_AMQP_RETRY_DELAY_SECONDS:-0.25}
      CMNC_INVENTORY_DHCP_LEASES_OBSERVED_QUEUE: cmnc.inventory.dhcp_leases_observed
    expose:
      - "8003"
    depends_on:
      cmnc-postgres:
        condition: service_healthy
      cmnc-rabbitmq:
        condition: service_healthy
    networks:
      - cmnc-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s

  # Background worker: never a startup prerequisite for the gateway or web.
  cmnc-mikrotik-poller-service:
    build:
      context: ..
      dockerfile: services/cmnc-mikrotik-poller-service/Dockerfile
    container_name: cmnc-mikrotik-poller-service
    restart: unless-stopped
    environment:
      CMNC_MIKROTIK_POLLER_HOST: 0.0.0.0
      CMNC_MIKROTIK_POLLER_PORT: 8006
      CMNC_MIKROTIK_POLLER_RABBITMQ_URL: amqp://${CMNC_RABBITMQ_USER:-cmnc}:${CMNC_RABBITMQ_PASSWORD:-cmnc_password}@cmnc-rabbitmq:5672/${CMNC_RABBITMQ_VHOST:-cmnc}
      CMNC_AMQP_PUBLISH_TIMEOUT_SECONDS: ${CMNC_AMQP_PUBLISH_TIMEOUT_SECONDS:-10}
      CMNC_AMQP_CONSUMER_ATTEMPTS: ${CMNC_AMQP_CONSUMER_ATTEMPTS:-3}
      CMNC_AMQP_RETRY_DELAY_SECONDS: ${CMNC_AMQP_RETRY_DELAY_SECONDS:-0.25}
      CMNC_MIKROTIK_POLLER_INVENTORY_SERVICE_URL: http://cmnc-inventory-service:8003
      CMNC_MIKROTIK_POLLER_MIKROTIK_TIMEOUT_SECONDS: 10
      CMNC_MIKROTIK_POLLER_SUPERVISOR_INTERVAL_SECONDS: 10
      CMNC_MIKROTIK_POLLER_ERROR_BACKOFF_MAX_SECONDS: ${CMNC_MIKROTIK_POLLER_ERROR_BACKOFF_MAX_SECONDS:-120}
      CMNC_MIKROTIK_POLLER_ERROR_BACKOFF_JITTER_FRACTION: ${CMNC_MIKROTIK_POLLER_ERROR_BACKOFF_JITTER_FRACTION:-0.1}
      CMNC_MIKROTIK_POLLER_HEARTBEAT_INTERVAL_SECONDS: ${CMNC_MIKROTIK_POLLER_HEARTBEAT_INTERVAL_SECONDS:-15}
      CMNC_MIKROTIK_POLLER_PUBLISH_EMPTY_SNAPSHOTS: "true"
    expose:
      - "8006"
    depends_on:
      cmnc-rabbitmq:
        condition: service_healthy
      cmnc-inventory-service:
        condition: service_healthy
    networks:
      - cmnc-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s

  cmnc-maintenance-service:
    build:
      context: ..
      dockerfile: services/cmnc-maintenance-service/Dockerfile
    container_name: cmnc-maintenance-service
    restart: unless-stopped
    environment:
      CMNC_MAINTENANCE_HOST: 0.0.0.0
      CMNC_MAINTENANCE_PORT: 8004
      CMNC_MAINTENANCE_DOCKER_SOCKET_PATH: /var/run/docker.sock
      CMNC_MAINTENANCE_CONTAINER_NAME_PREFIX: ${CMNC_MAINTENANCE_CONTAINER_NAME_PREFIX:-cmnc-}
      CMNC_MAINTENANCE_DOCKER_REQUEST_TIMEOUT_SECONDS: ${CMNC_MAINTENANCE_DOCKER_REQUEST_TIMEOUT_SECONDS:-5}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "8004"
    networks:
      - cmnc-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s

  cmnc-camera-service:
    build:
      context: ..
      dockerfile: services/cmnc-camera-service/Dockerfile
    container_name: cmnc-camera-service
    restart: unless-stopped
    environment:
      CMNC_CAMERA_HOST: 0.0.0.0
      CMNC_CAMERA_PORT: 8005
      CMNC_CAMERA_SESSION_TTL_SECONDS: ${CMNC_CAMERA_SESSION_TTL_SECONDS:-3600}
      CMNC_CAMERA_CLEANUP_INTERVAL_SECONDS: ${CMNC_CAMERA_CLEANUP_INTERVAL_SECONDS:-60}
      CMNC_CAMERA_VIEWER_IDLE_TIMEOUT_SECONDS: ${CMNC_CAMERA_VIEWER_IDLE_TIMEOUT_SECONDS:-90}
      CMNC_CAMERA_STREAM_STALL_TIMEOUT_SECONDS: ${CMNC_CAMERA_STREAM_STALL_TIMEOUT_SECONDS:-30}
      CMNC_CAMERA_FFMPEG_THREADS: ${CMNC_CAMERA_FFMPEG_THREADS:-2}
      CMNC_CAMERA_VIDEO_MODE: ${CMNC_CAMERA_VIDEO_MODE:-}
      CMNC_CAMERA_AUDIO_MODE: ${CMNC_CAMERA_AUDIO_MODE:-aac}
      CMNC_CAMERA_TRANSCODE_FPS: ${CMNC_CAMERA_TRANSCODE_FPS:-25}
      CMNC_CAMERA_TRANSCODE_CRF: ${CMNC_CAMERA_TRANSCODE_CRF:-20}
      CMNC_CAMERA_TRANSCODE_MAX_WIDTH: ${CMNC_CAMERA_TRANSCODE_MAX_WIDTH:-0}
      CMNC_CAMERA_TRANSCODE_PRESET: ${CMNC_CAMERA_TRANSCODE_PRESET:-veryfast}
      CMNC_CAMERA_STREAM_IDLE_TIMEOUT_SECONDS: ${CMNC_CAMERA_STREAM_IDLE_TIMEOUT_SECONDS:-45}
      CMNC_CAMERA_TRANSCODE_PROFILE: ${CMNC_CAMERA_TRANSCODE_PROFILE:-high}
      CMNC_CAMERA_TRANSCODE_LEVEL: ${CMNC_CAMERA_TRANSCODE_LEVEL:-5.1}
      CMNC_CAMERA_RTSP_TRANSPORT: ${CMNC_CAMERA_RTSP_TRANSPORT:-tcp}
      CMNC_CAMERA_RTSP_TIMEOUT_SECONDS: ${CMNC_CAMERA_RTSP_TIMEOUT_SECONDS:-10}
      CMNC_CAMERA_RTSP_RECONNECT_DELAY_SECONDS: ${CMNC_CAMERA_RTSP_RECONNECT_DELAY_SECONDS:-0.5}
      CMNC_CAMERA_TRANSCODE_VIDEO: ${CMNC_CAMERA_TRANSCODE_VIDEO:-false}
    expose:
      - "8005"
    networks:
      - cmnc-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s

  # Only login and dashboard backends gate the gateway; workers/cameras/maintenance do not.
  cmnc-veyon-proxy:
    build:
      context: ..
      dockerfile: services/cmnc-veyon-service/Proxy.Dockerfile
    container_name: cmnc-veyon-proxy
    restart: unless-stopped
    networks:
      - cmnc-network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --output /dev/null --max-time 3 http://127.0.0.1:11080/api/v1/feature"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s

  cmnc-veyon-service:
    build:
      context: ..
      dockerfile: services/cmnc-veyon-service/Dockerfile
    container_name: cmnc-veyon-service
    restart: unless-stopped
    environment:
      CMNC_VEYON_WEBAPI_URL: http://cmnc-veyon-proxy:11080
      CMNC_VEYON_TARGET_PORT: ${CMNC_VEYON_TARGET_PORT:-11100}
      CMNC_VEYON_DATA_DIR: /data
    volumes:
      - cmnc_veyon_data:/data
    expose:
      - "8008"
    depends_on:
      cmnc-veyon-proxy:
        condition: service_healthy
    networks:
      - cmnc-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s

  cmnc-api-gateway:
    build:
      context: ..
      dockerfile: services/cmnc-api-gateway/Dockerfile
    container_name: cmnc-api-gateway
    restart: unless-stopped
    environment:
      CMNC_API_GATEWAY_HOST: 0.0.0.0
      CMNC_API_GATEWAY_PORT: 8000
      CMNC_API_GATEWAY_AUTH_SERVICE_URL: http://cmnc-auth-service:8001
      CMNC_API_GATEWAY_CLASSROOM_SERVICE_URL: http://cmnc-classroom-service:8002
      CMNC_API_GATEWAY_INVENTORY_SERVICE_URL: http://cmnc-inventory-service:8003
      CMNC_API_GATEWAY_MIKROTIK_POLLER_SERVICE_URL: http://cmnc-mikrotik-poller-service:8006
      CMNC_API_GATEWAY_POLICY_SYNC_SERVICE_URL: http://cmnc-policy-sync-service:8007
      CMNC_API_GATEWAY_MAINTENANCE_SERVICE_URL: http://cmnc-maintenance-service:8004
      CMNC_API_GATEWAY_CAMERA_SERVICE_URL: http://cmnc-camera-service:8005
      CMNC_API_GATEWAY_VEYON_SERVICE_URL: http://cmnc-veyon-service:8008
    ports:
      - "127.0.0.1:${CMNC_API_GATEWAY_PORT:-8000}:8000"
    volumes:
      - ../.build-info.json:/app/.build-info.json:ro
    depends_on:
      cmnc-auth-service:
        condition: service_healthy
      cmnc-classroom-service:
        condition: service_healthy
      cmnc-inventory-service:
        condition: service_healthy
    networks:
      - cmnc-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s

  cmnc-web:
    build:
      context: ..
      dockerfile: apps/cmnc-web/Dockerfile
      args:
        VITE_API_BASE_URL: ${CMNC_WEB_API_BASE_URL:-}
        VITE_THUMBNAIL_REFRESH_INTERVAL_MS: ${CMNC_WEB_THUMBNAIL_REFRESH_INTERVAL_MS:-1000}
        VITE_THUMBNAIL_CONCURRENCY: ${CMNC_WEB_THUMBNAIL_CONCURRENCY:-100}
        VITE_RECORDING_MAX_DURATION_SECONDS: ${CMNC_WEB_RECORDING_MAX_DURATION_SECONDS:-5400}
        VITE_DASHBOARD_REFRESH_INTERVAL_MS: ${CMNC_WEB_DASHBOARD_REFRESH_INTERVAL_MS:-5000}
        VITE_ADMIN_PRESENCE_REFRESH_INTERVAL_MS: ${CMNC_WEB_ADMIN_PRESENCE_REFRESH_INTERVAL_MS:-30000}
        VITE_MAINTENANCE_REFRESH_INTERVAL_MS: ${CMNC_WEB_MAINTENANCE_REFRESH_INTERVAL_MS:-5000}
        VITE_ROUTERS_REFRESH_INTERVAL_MS: ${CMNC_WEB_ROUTERS_REFRESH_INTERVAL_MS:-5000}
        VITE_STATISTICS_REFRESH_INTERVAL_MS: ${CMNC_WEB_STATISTICS_REFRESH_INTERVAL_MS:-30000}
    container_name: cmnc-web
    restart: unless-stopped
    network_mode: host
    environment:
      CMNC_WEB_PORT: ${CMNC_WEB_PORT:-8080}
      CMNC_API_GATEWAY_PORT: ${CMNC_API_GATEWAY_PORT:-8000}
    depends_on:
      cmnc-api-gateway:
        condition: service_healthy

volumes:
  cmnc_postgres_data:
  cmnc_rabbitmq_data:
  cmnc_veyon_data:

networks:
  cmnc-network:
    name: cmnc-network
    driver: bridge
