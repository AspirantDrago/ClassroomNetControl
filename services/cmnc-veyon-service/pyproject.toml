[project]
name = "cmnc-veyon-service"
version = "0.1.0"
description = "Veyon screen and power integration for ClassroomMikrotikNetControl"
requires-python = "==3.15.2"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.2",
    "httpx==0.28.1",
    "cryptography==48.0.1",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
