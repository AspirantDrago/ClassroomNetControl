[project]
name = "cmnc-mikrotik-poller-service"
version = "0.1.0"
description = "MikroTik poller service for ClassroomMikrotikNetControl"
requires-python = "==3.14.8"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "aio-pika==10.1.1",
    "cmnc-contracts",
]

[tool.uv.sources]
cmnc-contracts = { workspace = true }

[project.scripts]
cmnc-mikrotik-poller-service = "cmnc_mikrotik_poller_service.main:run"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
