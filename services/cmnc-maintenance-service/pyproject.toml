[project]
name = "cmnc-maintenance-service"
version = "0.1.0"
description = "Maintenance service for ClassroomMikrotikNetControl"
requires-python = "==3.15.2"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "httpx==0.28.1",
    "python-multipart==0.0.33",
]

[project.scripts]
cmnc-maintenance-service = "cmnc_maintenance_service.main:run"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
