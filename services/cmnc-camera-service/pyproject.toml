[project]
name = "cmnc-camera-service"
version = "0.1.0"
description = "Camera streaming service for ClassroomMikrotikNetControl"
requires-python = "==3.15.2"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
]

[project.scripts]
cmnc-camera-service = "cmnc_camera_service.main:run"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
