[project]
name = "cmnc-classroom-service"
version = "0.1.0"
description = "Classroom configuration service for ClassroomMikrotikNetControl"
requires-python = "==3.15.2"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "sqlalchemy[asyncio]==2.1.8",
    "asyncpg==0.32.0",
    "aio-pika==10.2.2",
    "alembic==1.20.1",
    "cmnc-contracts",
]

[tool.uv.sources]
cmnc-contracts = { workspace = true }

[project.scripts]
cmnc-classroom-service = "cmnc_classroom_service.main:run"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
